
name: Cucumber Automation Pipeline

on:
  push:
    branches:
      - '**'

  schedule:
    - cron: '0 22 * * *'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Cucumber tests
        run: mvn clean test
        env:
          HEADLESS: 'true'

      - name: Save test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-and-screenshots
          path: |
            reports/
            screenshots/
          if-no-files-found: warn

